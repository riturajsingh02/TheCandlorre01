<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Portal Sign In &bull; The Candlorre</title>
  <link rel="icon" type="image/x-icon" href="asset/logo.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css" />
  <style>
    :root {
      --cabernet: #2B050B;
      --gold: #D4AF37;
      --border-color: #EAE5D9;
    }
    body {
      background-color: #F8F6F0;
      font-family: 'Montserrat', sans-serif;
      margin: 0;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
    }
    .login-card {
      background: #FFFFFF;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 40px 32px;
      width: 100%;
      max-width: 420px;
      box-shadow: 0 4px 20px rgba(43, 5, 11, 0.08);
      text-align: center;
    }
    .brand-logo {
      width: 64px;
      height: 64px;
      margin: 0 auto 16px;
      display: block;
    }
    .brand-title {
      font-family: 'Cormorant Garamond', serif;
      font-size: 28px;
      color: var(--cabernet);
      margin: 0 0 6px 0;
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .brand-sub {
      font-size: 11px;
      color: #888888;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      margin-bottom: 28px;
    }
    .form-group {
      text-align: left;
      margin-bottom: 20px;
    }
    .form-group label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--cabernet);
      margin-bottom: 6px;
      letter-spacing: 0.5px;
      text-transform: uppercase;
    }
    .form-control {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--border-color);
      border-radius: 4px;
      font-size: 14px;
      box-sizing: border-box;
      font-family: inherit;
    }
    .form-control:focus {
      outline: none;
      border-color: var(--gold);
    }
    .btn-submit {
      width: 100%;
      background-color: var(--cabernet);
      color: #FFFFFF;
      border: none;
      padding: 14px;
      border-radius: 4px;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      cursor: pointer;
      margin-top: 10px;
      transition: background 0.2s;
    }
    .btn-submit:hover {
      background-color: #420A12;
    }
    .error-msg {
      background-color: #FEF2F2;
      border: 1px solid #FCA5A5;
      color: #991B1B;
      padding: 10px 12px;
      border-radius: 4px;
      font-size: 13px;
      margin-bottom: 20px;
      display: none;
      text-align: left;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <img src="asset/logo.png" alt="The Candlorre" class="brand-logo" />
    <h1 class="brand-title">The Candlorre</h1>
    <div class="brand-sub">Store Administration Portal</div>

    <div class="error-msg" id="errorMsg"></div>

    <form id="adminLoginForm">
      <div class="form-group">
        <label for="adminEmail">Administrator Email</label>
        <input type="email" id="adminEmail" class="form-control" placeholder="admin@thecandlorre.com" required autocomplete="username" />
      </div>

      <div class="form-group">
        <label for="adminPassword">Master Password</label>
        <input type="password" id="adminPassword" class="form-control" placeholder="••••••••••••" required autocomplete="current-password" />
      </div>

      <button type="submit" class="btn-submit" id="loginBtn">Authenticate &rarr;</button>
    </form>
  </div>

  <script>
    const form = document.getElementById('adminLoginForm');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorMsg.style.display = 'none';
      loginBtn.disabled = true;
      loginBtn.textContent = 'Verifying Credentials...';

      const email = document.getElementById('adminEmail').value.trim();
      const password = document.getElementById('adminPassword').value;

      try {
        const res = await fetch('/api/admin/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password })
        });

        const data = await res.json();
        if (res.ok && data.success) {
          // Store token in session storage as well for backup
          if (data.token) {
            sessionStorage.setItem('candlorre_admin_token', data.token);
          }
          window.location.href = '/admin';
        } else {
          errorMsg.textContent = data.message || data.error || 'Authentication failed. Please verify your credentials.';
          errorMsg.style.display = 'block';
        }
      } catch (err) {
        errorMsg.textContent = 'Network error: ' + err.message;
        errorMsg.style.display = 'block';
      } finally {
        loginBtn.disabled = false;
        loginBtn.textContent = 'Authenticate →';
      }
    });
  </script>
</body>
</html>
